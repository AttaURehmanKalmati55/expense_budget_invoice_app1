name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Backup custom lib and pubspec
        run: |
          mkdir -p /tmp/custom_backup
          cp -r lib /tmp/custom_backup/
          cp pubspec.yaml /tmp/custom_backup/

      - name: Generate Android project structure & update Kotlin
        run: |
          flutter create --org com.example --project-name expense_budget_invoice_app .
          rm -rf lib
          cp -r /tmp/custom_backup/lib .
          cp /tmp/custom_backup/pubspec.yaml .
          if [ -f android/settings.gradle ]; then
            sed -i 's/org.jetbrains.kotlin.android" version "[0-9.]*"/org.jetbrains.kotlin.android" version "1.9.24"/g' android/settings.gradle
          fi
          if [ -f android/build.gradle ]; then
            sed -i "s/ext.kotlin_version = '[^']*'/ext.kotlin_version = '1.9.24'/g" android/build.gradle
          fi

      - name: Get dependencies & Build APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Expense-Budget-Invoice-App-APK
          path: build/app/outputs/flutter-apk/app-release.apk
